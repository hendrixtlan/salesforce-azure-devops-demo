# Azure Repos PR validation is enforced through a Branch Policy / Build Validation.
# Keep YAML PR triggers disabled and attach this pipeline to protected branches.
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: salesforce-integration

steps:
  - checkout: self
    clean: true

  - template: templates/setup-salesforce.yml

  - bash: |
      set -euo pipefail
      sf code-analyzer run --workspace . --target force-app --view table
    displayName: Salesforce static analysis

  - template: templates/auth-salesforce.yml
    parameters:
      secureFile: salesforce-integration-jwt.key
      alias: integration

  - bash: |
      set -euo pipefail
      export SF_ALIAS=integration
      ./scripts/validate-sandbox.sh
    displayName: Validate metadata and run Apex tests
